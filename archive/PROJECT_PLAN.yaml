# SEKCE 1: STRUKTURA ŘEŠENÍ
structure:
  components:
    - name: "analyzer.py"
      description: "Rozpoznání záměru a analýza dotazu"
    - name: "tools.py"
      description: "Nástroje pro přístup k API (Sayari, interní data)"
    - name: "state.py"
      description: "Definice typů pro stavový graf"
    - name: "graph.py"
      description: "Hlavní LangGraph workflow s definicí grafu"
    - name: "hybrid_workflow.py"
      description: "Rozšíření s React agentem pro komplexní scénáře"
  
  dataStructures:
    - name: "State"
      file: "state.py"
      description: "Stav workflow pro analýzu společností"
      fields:
        - name: "messages"
          type: "List[BaseMessage]"
          description: "Zprávy v konverzaci"
        - name: "company_analysis"
          type: "Optional[AnalysisResult]"
          description: "Výsledek analýzy dotazu"
        - name: "company_data"
          type: "Dict[str, Any]"
          description: "Externí data o společnostech (klíč: jméno společnosti)"
        - name: "internal_data"
          type: "Dict[str, Any]"
          description: "Interní data o společnostech"
        - name: "relationships_data"
          type: "Dict[str, Any]"
          description: "Data o vztazích společností"
        - name: "output"
          type: "Optional[str]"
          description: "Finální výstup pro uživatele"
        - name: "errors"
          type: "List[str]"
          description: "Seznam chyb během zpracování"
    
    - name: "AnalysisResult"
      file: "analyzer.py"
      description: "Výsledek analýzy uživatelského dotazu"
      fields:
        - name: "companies"
          type: "List[str]"
          description: "Seznam identifikovaných společností"
        - name: "company"
          type: "str"
          description: "Primární společnost (první v seznamu)"
        - name: "analysis_type"
          type: "Literal['risk_comparison', 'common_suppliers', 'general']"
          description: "Typ požadované analýzy"
        - name: "query"
          type: "str"
          description: "Původní dotaz uživatele"
        - name: "is_company_analysis"
          type: "bool"
          description: "Indikuje, zda se jedná o analýzu společnosti"
        - name: "confidence"
          type: "float"
          description: "Míra jistoty analýzy (0.0 - 1.0)"
    
    - name: "SayariApiTool"
      file: "tools.py"
      description: "Nástroj pro volání Sayari API"
      fields:
        - name: "name"
          type: "str"
          value: "sayari_api_tool"
        - name: "description"
          type: "str"
          value: "Získává informace o společnosti z Sayari API"
        - name: "base_url"
          type: "ClassVar[str]"
          value: "https://zyjgjpdwpdgfrpilxvvg.supabase.co/functions/v1/sayari-simulator"
    
    - name: "SupabaseInternalDataTool"
      file: "tools.py"
      description: "Nástroj pro získání interních dat o společnosti"
      fields:
        - name: "name"
          type: "str"
          value: "supabase_internal_data_tool"
        - name: "description"
          type: "str"
          value: "Získává interní data o společnosti včetně tier klasifikace a HS kódů"
        - name: "base_url"
          type: "ClassVar[str]"
          value: "https://zyjgjpdwpdgfrpilxvvg.supabase.co/functions/v1/get-supplier-data"
    
    - name: "SayariRelationshipsTool"
      file: "tools.py"
      description: "Nástroj pro získání vztahů entity z Sayari API"
      fields:
        - name: "name"
          type: "str"
          value: "sayari_relationships_tool"
        - name: "description"
          type: "str"
          value: "Získává vztahy entity (společnosti) z Sayari API"


components:
  - name: "analyzer.py"
    desc: "Rozpoznání záměru a analýza dotazu"
  - name: "tools.py"
    desc: "Nástroje pro přístup k API (Sayari, interní data)"
  - name: "state.py"
    desc: "Definice typů pro stavový graf"
  - name: "graph.py"
    desc: "Hlavní LangGraph workflow s definicí grafu"
  - name: "hybrid_workflow.py"
    desc: "Rozšíření s React agentem pro komplexní scénáře"

types:
  - name: "State"
    file: "state.py"
    desc: "Stav workflow pro analýzu společností"
    fields:
      - name: "messages"
        type: "List[BaseMessage]"
        desc: "Zprávy v konverzaci"
      - name: "company_analysis"
        type: "Optional[AnalysisResult]"
        desc: "Výsledek analýzy dotazu"
      - name: "company_data"
        type: "Dict[str, Any]"
        desc: "Externí data o společnostech (klíč: jméno společnosti)"
      - name: "internal_data"
        type: "Dict[str, Any]"
        desc: "Interní data o společnostech"
      - name: "relationships_data"
        type: "Dict[str, Any]"
        desc: "Data o vztazích společností"
      - name: "output"
        type: "Optional[str]"
        desc: "Finální výstup pro uživatele"
      - name: "errors"
        type: "List[str]"
        desc: "Seznam chyb během zpracování"
  
  - name: "AnalysisResult"
    file: "analyzer.py"
    desc: "Výsledek analýzy uživatelského dotazu"
    fields:
      - name: "companies"
        type: "List[str]"
        desc: "Seznam identifikovaných společností"
      - name: "company"
        type: "str"
        desc: "Primární společnost (první v seznamu)"
      - name: "analysis_type"
        type: "Literal['risk_comparison', 'common_suppliers', 'general']"
        desc: "Typ požadované analýzy"
      - name: "query"
        type: "str"
        desc: "Původní dotaz uživatele"
      - name: "is_company_analysis"
        type: "bool"
        desc: "Indikuje, zda se jedná o analýzu společnosti"
      - name: "confidence"
        type: "float"
        desc: "Míra jistoty analýzy (0.0 - 1.0)"

tools:
  - name: "SayariApiTool"
    file: "tools.py"
    desc: "Nástroj pro volání Sayari API"
    props:
      - name: "name"
        value: "sayari_api_tool"
      - name: "base_url"
        value: "https://zyjgjpdwpdgfrpilxvvg.supabase.co/functions/v1/sayari-simulator"
  
  - name: "SupabaseInternalDataTool"
    file: "tools.py"
    desc: "Nástroj pro získání interních dat o společnosti"
    props:
      - name: "name"
        value: "supabase_internal_data_tool"
      - name: "base_url"
        value: "https://zyjgjpdwpdgfrpilxvvg.supabase.co/functions/v1/get-supplier-data"
  
  - name: "SayariRelationshipsTool"
    file: "tools.py"
    desc: "Nástroj pro získání vztahů entity z Sayari API"
    props:
      - name: "name"
        value: "sayari_relationships_tool"

